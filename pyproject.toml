[project]
name = "A-Maze-Ing"
version = "0.0.1"
authors = [
  { name="Petit Romeo", email="rpetit@student.42lyon.fr" },
  { name="Matisse Thetcharoen", email="mthetcha@student.42lyon.fr" },
]
description = "Maze lib for A-Maz-Ing"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/69Nesta/42-A-Maze-Ing"
Issues = "https://github.com/69Nesta/42-A-Maze-Ing/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
